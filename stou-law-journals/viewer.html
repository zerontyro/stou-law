  <style>
    :root {

      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --font: 'Sarabun', sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0b0f19;
      --card: #131b2e;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
    body, html { height: 100vh; overflow: hidden; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; }
    
    .top-bar { height: 60px; background-color: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; flex-shrink: 0; }
    .nav-left { display: flex; align-items: center; gap: 1rem; }
    .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--muted); text-decoration: none; font-weight: 600; padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); transition: all 0.2s; font-size: 0.9rem; }
    .back-btn:hover { background-color: var(--bg); color: var(--text); }
    .doc-title { font-weight: 700; font-size: 1.1rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px; }
    
    .nav-right { display: flex; align-items: center; gap: 0.75rem; }
    .view-btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg); color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .view-btn:hover, .view-btn.active { background-color: var(--primary); color: #fff; border-color: var(--primary); }
    
    .content-area { flex: 1; display: flex; height: calc(100vh - 60px); overflow: hidden; }
    .pdf-pane { flex: 1; height: 100%; border-right: 1px solid var(--border); background-color: #525659; }
    .pdf-pane iframe, .pdf-pane object { width: 100%; height: 100%; border: none; }
    
    .summary-pane { width: 420px; height: 100%; background-color: var(--card); overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; flex-shrink: 0; }
    .summary-pane h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; }
    .summary-content { font-size: 0.95rem; line-height: 1.7; color: var(--text); }
    .summary-content h3 { font-size: 1.05rem; margin-top: 1.25rem; margin-bottom: 0.5rem; font-weight: 700; }
    .summary-content ul { padding-left: 1.2rem; margin-bottom: 1rem; }
    .summary-content li { margin-bottom: 0.4rem; }
    
    @media (max-width: 850px) {
      .summary-pane { display: none; }
      .doc-title { max-width: 250px; }

</head>
